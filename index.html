<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1017" />
  <title>Escala UE 2026 • Carlos</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div>
        <div class="eyebrow">Urgência e Emergência • Rodízio 2026</div>
        <h1>Escala Completa</h1>
        <p>21/09 a 08/11 • todos os setores, todos os dias e todas as equipes</p>
        <div class="legend">
          <span class="legend-chip carlos-legend">Carlos</span>
          <span class="legend-text">dia/setor com seu nome = destaque neon</span>
        </div>
      </div>
      <div class="hero-actions">
        <button id="btnAll" class="btn active">Todos os dias</button>
        <button id="btnCarlos" class="btn">Só dias com Carlos</button>
        <button id="btnPrint" class="btn">Imprimir / PDF</button>
      </div>
    </header>

    <section id="summary" class="summary"></section>

    <section class="toolbar">
      <div id="weekTabs" class="week-tabs" aria-label="Semanas"></div>
      <button id="btnCurrent" class="btn btn-subtle">Semana atual</button>
    </section>

    <main id="scheduleRoot"></main>

    <section class="trades-box">
      <button id="tradeToggle" class="trades-toggle">
        <span>
          <strong>Trocas aplicadas</strong>
          <small>IDs 09–16 • toque para consultar</small>
        </span>
        <span id="tradeArrow">＋</span>
      </button>
      <div id="tradePanel" class="trades-panel hidden"></div>
    </section>

    <footer>
      Base: escala completa atualizada enviada pelo usuário + trocas confirmadas.
      O ID 14 foi corrigido para Eixo Diurno • 06/11 • 12h.
    </footer>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
